[tool.poetry]
name = "mining-equipment-monitoring"
version = "0.1.0"
description = "Backend for a mining equipment condition monitoring system."
authors = ["Egor Zharskiy"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.12.*"
fastapi = "0.128.7"
uvicorn = "0.40.0"
sqlalchemy = "2.0.46"
pydantic-settings = "2.12.0"
asyncpg = "0.31.0"
greenlet = "3.3.1"
alembic = "1.18.4"
email-validator = "2.3.0"
PyJWT = "2.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
