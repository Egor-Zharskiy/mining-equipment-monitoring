[tool.poetry]
name = "mining-equipment-monitoring"
version = "0.1.0"
description = "Backend for a mining equipment condition monitoring system."
authors = ["Egor Zharskiy"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.12.*"
fastapi = "0.128.7"
uvicorn = "0.40.0"
sqlalchemy = "2.0.46"
pydantic-settings = "2.12.0"
asyncpg = "0.31.0"
greenlet = "3.3.1"
alembic = "1.18.4"
email-validator = "2.3.0"
PyJWT = "2.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-asyncio = "1.2.0"
httpx = "0.28.1"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
